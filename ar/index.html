<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <body style="margin: 0px; overflow: hidden">
    <a-scene embedded arjs>
      <!-- <a-marker preset=""> -->
      <a-marker preset="custom" type="pattern" url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/p.patt">
        <!-- we use cors proxy to avoid cross-origin problems -->
        <!--
          ⚠️⚠️⚠️
          https://arjs-cors-proxy.herokuapp.com/ is now offline, Heroku has dismissed all his free plans from November 2022.
          You need to host your own proxy and use it instead. The proxy is based on CORS Anywhere (see https://github.com/Rob--W/cors-anywhere).
          ⚠️⚠️⚠️
        -->
        <a-sphere color="red" radius="1" material='opacity: 0.5;'></a-sphere>

      </a-marker>
      <a-marker preset="custom" type="pattern" url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/p2.patt">
        <!-- we use cors proxy to avoid cross-origin problems -->
        <!--
          ⚠️⚠️⚠️
          https://arjs-cors-proxy.herokuapp.com/ is now offline, Heroku has dismissed all his free plans from November 2022.
          You need to host your own proxy and use it instead. The proxy is based on CORS Anywhere (see https://github.com/Rob--W/cors-anywhere).
          ⚠️⚠️⚠️
        -->
        <a-cylinder color="blue" radius="1" height="3" material='opacity: 0.5;'></a-cylinder>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
