<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <body style="margin: 0px; overflow: hidden">
    <a-scene embedded arjs>
      <!-- <a-marker preset=""> -->
      <a-marker
        preset="custom"
        type="pattern"
        url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/pattern-globular.patt"
      >
   
                <a-sphere color="red" radius="1" material='opacity: 0.5;'></a-sphere>

      </a-marker>
     
      <a-marker
        preset="custom"
        type="pattern"
        url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/pattern-cone.patt"
      >
      
        <a-cone color="tomato" radius-bottom="0.6" radius-top="0" material='opacity: 0.5' height="2" ></a-cone>
      </a-marker>
       <a-marker
        preset="custom"
        type="pattern"
        url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/pattern-cylinder.patt"
      >
      
        <a-cylinder
          color="blue"
          radius="1"
          height="3"
          material="opacity: 0.5;"
        ></a-cylinder>
      </a-marker>
      <a-marker
        preset="custom"
        type="pattern"
        url="https://raw.githubusercontent.com/threalwinky/Mathmystic/main/ar/pattern-rec.patt"
      >
        ơ
        <a-cylinder
          color="blue"
          radius="1"
          height="3"
          material="opacity: 0.5;"
        ></a-cylinder>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
